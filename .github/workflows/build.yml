name: Build Desktop Installers

# 触发方式：推送 v 开头的 tag，或在 Actions 页面手动 Run workflow
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            package: package:win
            artifact_name: SMEbuddy-windows-x64
          - os: macos-latest
            package: package:mac
            artifact_name: SMEbuddy-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare Python venv and backend dependencies
        run: npm run predev

      - name: Build installer
        run: npm run ${{ matrix.package }}
        env:
          # 提高 electron-builder 下载 Electron / nsis 等资源时的限额
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

      # 打 tag 时同时发布到 GitHub Release
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
